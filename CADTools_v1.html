<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Process Tool Template</title>
<!--
  ============================================================================
  DESIGN PROCESS — STANDARD HTML TOOL TEMPLATE  (DP_Tool_Template_v1.html)
  Repo: github.com/Wombatchops/Template   ·   Spec: docs/TEMPLATE_STANDARD_v1.md
  ----------------------------------------------------------------------------
  To build a new tool: copy this file, rename it <ToolName>_v1.html, then edit
  ONLY the block marked "1. TOOL CONFIG" (APP, VERSION_HISTORY, NAV,
  HEADER_RIGHT, PAGES). Everything under "2. TEMPLATE CORE" is the shared
  standard — change it in this repo first, not per tool.
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Design tokens — same system as Overall Business Dashboard & Cadet Review ===== */
  :root{
    --paper:#e9edf1; --panel:#ffffff; --panel-alt:#f4f6f8;
    --line:#ccd4da; --line-strong:#9aa5ae;
    --ink:#1c2127; --ink-soft:#4b535c; --ink-faint:#7c848d;
    --navy:#1f3a5f; --navy-deep:#132743; --navy-soft:#dbe4ee; --steel:#3a6ea5; --steel-soft:#dfeaf5;
    --amber:#c98a1f; --amber-deep:#8a5d12; --amber-soft:#faf0dc; --amber-border:#e3c98a; --amber-ink:#6b4e0f;
    --green:#2f7d53; --green-soft:#e2f2e8; --green-border:#bcdac8;
    --rust:#b3432b; --rust-soft:#f7e5e0; --rust-border:#e8c4b8;
    --radius:6px; --radius-sm:4px;
    --font:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --tab-w:132px;
    --nav-w:250px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{font-family:var(--font); color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; overflow:hidden;}
  button,input,select,textarea{font-family:var(--font); font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  h1,h2,h3,h4,p{margin:0;}
  a{color:var(--steel);}
  ::selection{background:var(--steel-soft);}
  .scroll::-webkit-scrollbar{width:10px;height:10px;}
  .scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:2px solid var(--panel);}

  #app{height:100vh; display:flex; flex-direction:column;}

  /* ===== HEADER (standard) — left: logo · title · version  |  right: tool-specific ===== */
  header.dp-head{flex:0 0 auto; background:var(--navy); color:#eef3f8; border-bottom:2px solid var(--navy-deep);
    display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 22px; flex-wrap:wrap;}
  .dp-head-left{display:flex; align-items:center; gap:14px; min-width:0; flex:1 1 420px;}
  .dp-head-left img.logo{height:28px; width:auto; display:block; flex:0 0 auto;}
  .dp-head-left .divider{width:1px; align-self:stretch; background:rgba(255,255,255,.18);}
  .dp-title{min-width:0;}
  .dp-title-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .dp-title h1{font-size:19px; font-weight:600; letter-spacing:.01em; white-space:nowrap;}
  .dp-title .sub{font-size:12px; color:#b7c7d8; margin-top:3px;}
  .ver-btn{font-family:var(--font-mono); font-size:11.5px; color:#cfe0ef; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22); padding:3px 9px; border-radius:var(--radius-sm); white-space:nowrap;}
  .ver-btn:hover{background:rgba(255,255,255,.16); color:#fff;}
  .file-pill{font-family:var(--font-mono); font-size:10.5px; color:#8fa8c2; white-space:nowrap;}

  .dp-head-right{display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; flex:1 1 360px;}
  .hgroup{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .hsep{width:1px; height:22px; background:rgba(255,255,255,.18); margin:0 4px;}
  /* Header buttons — blue (steel) / orange (amber) / ghost, as used on the dashboard tabs & backup bar */
  .hbtn{font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:var(--radius-sm); border:1px solid rgba(255,255,255,.35);
    background:transparent; color:#eef3f8; white-space:nowrap; line-height:1.3;}
  .hbtn:hover{background:rgba(255,255,255,.12);}
  .hbtn.steel{background:var(--steel); border-color:var(--navy-deep); color:#fff;}
  .hbtn.steel:hover{background:#4579b0;}
  .hbtn.amber{background:var(--amber); border-color:var(--amber-deep); color:#fff;}
  .hbtn.amber:hover{background:#d6962a;}
  .hbtn:disabled{opacity:.5; cursor:default;}
  .hpill{font-family:var(--font-mono); font-size:11.5px; color:#cfe0ef; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.22); padding:4px 10px; border-radius:var(--radius-sm); white-space:nowrap;}
  .hpill.warn{color:#fff; background:var(--amber); border-color:var(--amber);}
  .hfield{display:flex; align-items:center; gap:6px;}
  .hfield label{font-size:11px; color:#b7c7d8;}
  .hfield select,.hfield input{font-family:var(--font-mono); font-size:11.5px; padding:4px 6px; border-radius:var(--radius-sm);
    border:1px solid rgba(255,255,255,.35); background:#27466e; color:#fff; max-width:220px;}
  /* Standard navigation-layout switch (always last in the header) */
  .seg{display:inline-flex; border:1px solid var(--navy-deep); border-radius:var(--radius-sm); overflow:hidden;}
  .seg button{border:none; border-right:1px solid var(--navy-deep); background:var(--steel); color:#fff; font-size:11px; font-weight:600; padding:5px 10px; white-space:nowrap;}
  .seg button:last-child{border-right:none;}
  .seg button[aria-pressed="true"]{background:var(--amber); color:#fff;}
  .seg-label{font-size:10px; font-family:var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:#8fa8c2;}

  /* ===== HORIZONTAL NAV — line 1 sections, line 2 pages, line 3 subpages ===== */
  #hnav{flex:0 0 auto; display:none;}
  body.nav-h #hnav{display:block;}
  nav.tabs{display:flex; padding:0 22px; background:var(--paper); overflow-x:auto;}
  nav.tabs:empty{display:none;}
  .tab{width:var(--tab-w); min-width:var(--tab-w); padding:7px 8px; font-size:12px; font-weight:600; text-align:center;
    border:1px solid var(--navy-deep); border-top:none; margin-right:-1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  nav.l1 .tab{background:var(--steel); color:#fff;}
  nav.l1 .tab:hover{background:#4579b0;}
  nav.l1 .tab[aria-selected="true"]{background:var(--amber); border-color:var(--amber-deep);}
  nav.l2 .tab{background:var(--amber-soft); color:var(--amber-ink); border-color:var(--amber-border);}
  nav.l2 .tab:hover{background:#f6e6c4;}
  nav.l2 .tab[aria-selected="true"]{background:var(--amber); color:#fff; border-color:var(--amber-deep);}
  nav.l3 .tab{background:var(--panel); color:var(--navy); border-color:var(--line-strong); font-weight:600; width:auto; min-width:110px; padding:6px 14px;}
  nav.l3 .tab:hover{background:var(--steel-soft);}
  nav.l3 .tab[aria-selected="true"]{background:var(--steel); color:#fff; border-color:var(--navy-deep);}
  .tab .cnt{font-family:var(--font-mono); font-size:10px; opacity:.8; margin-left:5px;}

  /* ===== BODY: vertical nav (left, tight) + content ===== */
  #body{flex:1 1 auto; min-height:0; display:flex; position:relative;}
  body.nav-h #body{margin-top:10px; border-top:1px solid var(--line);}

  /* ===== VERTICAL NAV — collapsible at Section and Page level (Cadet Review pattern) ===== */
  #vnav{display:none; width:var(--nav-w); flex:0 0 auto; background:var(--panel); border-right:1px solid var(--line); flex-direction:column; min-height:0;}
  body.nav-v #vnav{display:flex;}
  #vnav-split{display:none; flex:0 0 6px; background:var(--paper); cursor:col-resize; position:relative;}
  body.nav-v #vnav-split{display:block;}
  #vnav-split::after{content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:2px; height:32px; background:var(--line-strong); border-radius:2px;}
  #vnav-split:hover::after, #vnav-split.dragging::after{background:var(--steel);}
  .panel-head{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px 9px 12px;
    border-bottom:1px solid var(--line); background:var(--panel-alt);}
  .panel-head h2{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .panel-head .hint{font-size:10.5px; color:var(--ink-faint);}
  .ph-actions{display:flex; gap:4px;}
  .icon-btn{background:none; border:1px solid var(--line-strong); border-radius:3px; min-width:22px; height:20px; font-size:11px;
    color:var(--ink-soft); line-height:1; padding:0 5px; font-family:var(--font-mono);}
  .icon-btn:hover{background:var(--panel); color:var(--ink);}
  .vn-body{flex:1 1 auto; overflow:auto; min-height:0; outline:none;}
  .vn-group{border-bottom:1px solid var(--line);}
  .vn-row{display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; font-size:12.5px; user-select:none; border-left:3px solid transparent;}
  .vn-row:hover{background:var(--panel-alt);}
  .vn-row .chev{font-size:9px; color:var(--ink-faint); width:12px; text-align:center; flex:0 0 auto;}
  .vn-row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .vn-row .cnt{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint);}
  .vn-all{font-weight:600; color:var(--ink-soft); border-bottom:1px solid var(--line);}
  .vn-sec{font-weight:600;}
  .vn-sec.selected{background:var(--steel-soft);}
  .vn-page{padding-left:24px; font-size:12px; color:var(--ink-soft);}
  .vn-sub{padding-left:46px; font-size:11.5px; color:var(--ink-soft);}
  .vn-page.selected,.vn-sub.selected{background:var(--steel-soft); border-left-color:var(--steel); color:var(--ink); font-weight:600;}
  .vn-page.in-path{color:var(--ink); font-weight:600;}
  .vn-row.cursor{outline:1px dashed var(--steel); outline-offset:-2px;}
  .vn-children{display:none;}
  .vn-children.open{display:block;}
  /* whole nav panel collapsed to a rail */
  #vnav.collapsed{width:34px !important;}
  #vnav.collapsed .vn-body, #vnav.collapsed .panel-head h2, #vnav.collapsed .panel-head .hint, #vnav.collapsed .ph-actions .x-exp{display:none;}
  #vnav.collapsed .panel-head{padding:9px 5px; justify-content:center;}
  #vnav .rail-label{display:none;}
  #vnav.collapsed .rail-label{display:block; writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); padding:14px 0; margin:0 auto; cursor:pointer;}

  /* ===== CONTENT ===== */
  main#content{flex:1 1 auto; min-width:0; overflow:auto; display:flex; flex-direction:column;}
  .page-head{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 22px 0;}
  .crumbs{font-size:11.5px; color:var(--ink-faint);}
  .crumbs b{color:var(--ink-soft); font-weight:600;}
  .page-head h2{font-size:17px; font-weight:600; color:var(--navy); margin-top:2px;}
  .page-head-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .wrap{padding:12px 22px 48px;}

  /* ===== Shared components ===== */
  .btn{appearance:none; border:1px solid var(--line-strong); background:var(--panel); color:var(--ink); padding:6px 12px; font-size:12.5px;
    font-weight:600; border-radius:var(--radius-sm); line-height:1.3; white-space:nowrap;}
  .btn:hover{background:var(--panel-alt);}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn-sm{padding:3px 9px; font-size:11px;}
  .btn-navy{background:var(--navy); border-color:var(--navy-deep); color:#fff;}
  .btn-navy:hover{background:#274c78;}
  .btn-steel{background:var(--steel); border-color:var(--navy-deep); color:#fff;}
  .btn-steel:hover{background:#4579b0;}
  .btn-amber{background:var(--amber); border-color:var(--amber-deep); color:#fff;}
  .btn-amber:hover{background:#d6962a;}

  .section-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:16px 0 10px;
    background:var(--navy-soft); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 12px;}
  .section-head-left{display:flex; align-items:center; gap:10px;}
  .section-head h3{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--navy);}
  .section-head .note{font-size:11.5px; color:var(--ink-faint);}
  .sec-toggle{border:1px solid var(--navy); background:var(--navy); color:#fff; width:20px; height:20px; border-radius:3px; font-size:13px; font-weight:700;
    line-height:1; display:flex; align-items:center; justify-content:center; padding:0; font-family:var(--font-mono);}
  .sec-toggle:hover{background:var(--navy-deep);}
  .section-body.collapsed{display:none;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
  .card h4{font-size:13px; font-weight:700; color:var(--navy); margin-bottom:6px;}
  .card p{font-size:12.5px; line-height:1.55; color:var(--ink-soft);}
  .two-col{display:grid; grid-template-columns:3fr 2fr; gap:16px;}
  @media (max-width:1100px){ .two-col{grid-template-columns:1fr;} }
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
  .kpi .lbl{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--navy);}
  .kpi .val{font-family:var(--font-mono); font-size:22px; font-weight:600; margin-top:6px; color:var(--ink);}
  .kpi .sub{font-size:11px; color:var(--ink-faint); margin-top:2px;}

  .st{display:inline-block; font-family:var(--font-mono); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 6px; border-radius:3px; white-space:nowrap;}
  .st-ok{background:var(--green-soft); color:var(--green); border:1px solid var(--green-border);}
  .st-wait{background:var(--amber-soft); color:var(--amber-ink); border:1px solid var(--amber-border);}
  .st-bad{background:var(--rust-soft); color:var(--rust); border:1px solid var(--rust-border);}
  .st-info{background:var(--steel-soft); color:var(--navy); border:1px solid #b9cde3;}
  .st-na{background:var(--panel-alt); color:var(--ink-faint); border:1px solid var(--line);}
  .banner{font-size:12.5px; padding:10px 14px; border-radius:var(--radius-sm); line-height:1.5; background:var(--amber-soft); border:1px solid var(--amber-border); color:var(--amber-ink);}
  .banner.info{background:var(--steel-soft); border-color:#b9cde3; color:var(--navy);}
  .banner.bad{background:var(--rust-soft); border-color:var(--rust-border); color:var(--rust);}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .demo-dark{background:var(--navy); padding:12px; border-radius:var(--radius-sm); display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  ol.steps{margin:0; padding:12px 16px 12px 34px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); font-size:13px; line-height:1.6;}
  code{font-family:var(--font-mono); font-size:11.5px; background:var(--panel-alt); border:1px solid var(--line); border-radius:3px; padding:0 4px;}

  /* ===== STANDARD DATA TABLE (DPTable) — sort · Excel-style filter · hide/restore · resize · totals
         Same look & behaviour as Overall Business Dashboard › Timesheets › Projects ===== */
  .tbl-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .tbl-toolbar{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--panel-alt);}
  .tbl-toolbar .tl,.tbl-toolbar .tr{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .tbl-toolbar .tr{margin-left:auto;}
  .tbl-toolbar h3{font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .tbl-toolbar .shown{font-size:11.5px; color:var(--ink-faint);}
  .hidden-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .hidden-chip{font-size:11px; font-weight:600; color:var(--ink-soft); background:var(--panel-alt); border:1px dashed var(--line-strong); padding:4px 9px; border-radius:12px;}
  .hidden-chip:hover{border-color:var(--steel); color:var(--steel);}
  .tbl-wrap{overflow-x:auto;}
  table.dp-grid{border-collapse:separate; border-spacing:0; table-layout:fixed; min-width:100%; font-size:12px;}
  table.dp-grid thead th{background:var(--navy); color:#fff; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:0; text-align:left; white-space:nowrap; user-select:none; position:relative; border-bottom:1px solid var(--navy-deep); position:sticky; top:0; z-index:2;}
  table.dp-grid thead th + th{border-left:1px solid rgba(255,255,255,.10);}
  .th-inner{display:flex; align-items:center; justify-content:space-between; gap:4px; padding:9px 6px 9px 8px; overflow:hidden;}
  .th-label{display:flex; align-items:center; gap:4px; overflow:hidden; cursor:pointer; flex:1 1 auto; min-width:0;}
  .th-label.right{justify-content:flex-end;} .th-label.center{justify-content:center;}
  .th-label.nosort{cursor:default;}
  .th-text{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .sort-arrow{opacity:.85; font-size:9px; flex:0 0 auto;}
  .th-controls{display:flex; align-items:center; gap:4px; flex:0 0 auto;}
  .th-icon-btn{border:none; background:rgba(255,255,255,.12); color:#dbe6f0; width:16px; height:16px; border-radius:3px;
    font-size:9px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .th-icon-btn:hover{background:rgba(255,255,255,.28); color:#fff;}
  .th-icon-btn.active{background:var(--amber); color:#2a1c00;}
  /* narrow columns: filter / hide buttons appear on hover (or while a filter is on) so the label fits */
  table.dp-grid thead th.th-narrow .th-controls{display:none;}
  table.dp-grid thead th.th-narrow:hover .th-controls, table.dp-grid thead th.th-narrow:focus-within .th-controls, table.dp-grid thead th.th-narrow .th-controls:has(.active){display:flex;}
  table.dp-grid thead th.th-narrow:hover .th-controls{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:var(--navy); padding-left:3px;}
  .rs{position:absolute; top:0; right:-3px; width:7px; height:100%; cursor:col-resize; z-index:3;}
  .rs::after{content:""; position:absolute; top:25%; bottom:25%; left:3px; width:1px; background:rgba(255,255,255,.35);}
  .rs:hover::after,.rs.dragging::after{background:var(--amber); width:2px;}
  table.dp-grid td{padding:7px 8px; border-bottom:1px solid var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  table.dp-grid tbody tr:nth-child(even) td{background:var(--panel-alt);}
  table.dp-grid tbody tr:hover td{background:var(--steel-soft);}
  table.dp-grid td.num{font-family:var(--font-mono); font-size:11.5px; text-align:right;}
  table.dp-grid td.center{text-align:center;}
  table.dp-grid tfoot td{background:var(--navy-soft); font-weight:700; color:var(--navy); border-top:2px solid var(--navy); border-bottom:none;}
  table.dp-grid td.empty{text-align:center; color:var(--ink-faint); padding:18px; white-space:normal;}
  /* filter popup */
  .filter-pop{position:fixed; z-index:60;}
  .filter-panel{width:220px; background:#fff; border:1px solid var(--line-strong); border-radius:var(--radius-sm); box-shadow:0 6px 18px rgba(20,30,45,.18);
    padding:8px; color:var(--ink); font-weight:400;}
  .filter-search{width:100%; font-size:12px; padding:5px 7px; border:1px solid var(--line); border-radius:3px; margin-bottom:6px; background:var(--panel-alt);}
  .filter-row{display:flex; align-items:center; gap:7px; font-size:12px; padding:3px 2px; cursor:pointer; word-break:break-word;}
  .filter-select-all{border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:4px; font-weight:600;}
  .filter-list{max-height:180px; overflow-y:auto;}
  .filter-empty{font-size:11.5px; color:var(--ink-faint); padding:8px 2px;}
  .filter-hint{font-size:10.5px; color:var(--ink-faint); margin:-2px 0 6px;}
  .filter-actions{display:flex; justify-content:flex-end; gap:6px; margin-top:8px; padding-top:6px; border-top:1px solid var(--line);}

  /* ===== Version history modal ===== */
  .vh-overlay{position:fixed; inset:0; background:rgba(19,39,67,.55); display:flex; align-items:center; justify-content:center; z-index:100;}
  .vh-modal{background:var(--panel); width:min(600px,92vw); max-height:80vh; display:flex; flex-direction:column; border-radius:var(--radius-sm); box-shadow:0 12px 40px rgba(0,0,0,.3);}

/* ---------- leaves, field parsing and PAGES ---------- */
function parseF(s) { const a = s.split('|'); return { k: a[0], l: a[1], u: a[2] || '', opt: a[3] ? a[3].split('/') : null, num: !!a[2] && a[2] !== '-' && !a[3] || a[2] === '-' }; }
const LEAVES = [];
DEF.forEach((s) => s.pages.forEach((p) => {
  if (p.subpages) p.subpages.forEach((sp) => LEAVES.push({ s: s, p: p, sp: sp, path: s.id + '/' + p.id + '/' + sp.id, c: sp.c, fn: sp.fn || p.fn }));
  else LEAVES.push({ s: s, p: p, sp: null, path: s.id + '/' + p.id, c: p.c, fn: p.fn });
}));
LEAVES.forEach((L) => { if (L.c) { L.c.fields = L.c.p.map(parseF); L.tag = (L.sp ? L.p.id.slice(0, 3) + '-' + L.sp.id.slice(0, 3) : L.p.id.slice(0, 4)).toUpperCase(); } });
const AREAS = ['Whole plant'].concat(LEAVES.filter((L) => L.c && L.c.area).map((L) => L.p.label));

const SPECIAL = { overview: renderOverview, info: renderInfo, saved: renderSaved, settings: renderSettings, options: renderOptions, review: renderReview, iterate: renderIterate };
const PAGES = {};
LEAVES.forEach((L) => {
  const fn = L.fn ? SPECIAL[L.fn] : (ctx) => renderComponent(ctx, L);
  PAGES[L.path] = (ctx) => { refreshHeader(); fn(ctx); };
});

/* ---------- project data (working copy in this browser; library of saved projects) ---------- */
let PROJ = null;
let DIRTY = null;
let PENDING_AREA = null;
let LAST_AREA = null;
let REVIEW_AREA = 'All areas';
const ARM = {};

function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function nowStr() { const d = new Date(); return today() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function blankProject() { return { app: 'CADTools', schema: 1, id: 'P' + Date.now().toString(36), no: '', name: 'Untitled project', client: '', site: '', coord: '', units: 'Metric (mm / m)', desc: '', created: today(), saved: '', rev: 0, items: {}, options: [] }; }
function proj() { if (!PROJ) { PROJ = LS.get('current', null) || blankProject(); DIRTY = LS.get('dirty', false); } return PROJ; }
function library() { return LS.get('library', {}); }
function touch() { DIRTY = true; LS.set('current', PROJ); LS.set('dirty', true); refreshHeader(); }
function projItems(path) { const p = proj(); return p.items[path] || (p.items[path] = []); }
function itemCount() { const p = proj(); return Object.keys(p.items).reduce((n, k) => n + p.items[k].length, 0); }
function slug(s) { return String(s || 'project').trim().replace(/[^A-Za-z0-9-]+/g, '_').replace(/^_+|_+$/g, '') || 'project'; }
function armed(key, msg) { const t = Date.now(); if (ARM[key] && t - ARM[key] < 4000) { delete ARM[key]; return true; } ARM[key] = t; toast(msg); return false; }

function refreshHeader() {
  const p = proj();
  const nm = p.no || p.name, short = nm.length > 22 ? nm.slice(0, 21) + '…' : nm;
  setHeaderText('hdrProj', short + ' · rev ' + (p.rev || 0) + (DIRTY ? ' · unsaved' : ''), !!DIRTY);
  const hp = document.getElementById('hdrProj'); if (hp) hp.title = (p.no ? p.no + ' · ' : '') + p.name + (DIRTY ? ' — unsaved changes' : '');
  setHeaderText('hdrCount', itemCount() + ' items · ' + p.options.length + ' opts');
}

function saveProject() {
  const p = proj();
  p.rev = (p.rev || 0) + 1; p.saved = nowStr();
  const lib = library(); lib[p.id] = clone(p); LS.set('library', lib);
  LS.set('current', p); DIRTY = false; LS.set('dirty', false);
  refreshHeader(); toast('Saved "' + p.name + '" as rev ' + p.rev + ' in this browser. Use Export for a file copy.');
}
function newProjectClick() {
  if (DIRTY && !armed('new', 'Unsaved changes — click New again within 4 s to discard them.')) return;
  PROJ = blankProject(); LS.set('current', PROJ); DIRTY = false; LS.set('dirty', false);
  toast('New blank project started.'); go('project', 'info');
}
function download(name, text, type) {
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); toast('Downloaded ' + name);
  } catch (e) { toast('Download blocked here: ' + e.message); }
}
function exportProject() {
  const p = proj();
  download('CADTools_' + slug(p.no || p.name) + '_v' + (p.rev || 0) + '.json', JSON.stringify(p, null, 2), 'application/json');
  if (DIRTY) setTimeout(() => toast('Exported with unsaved changes — the file name uses the last saved rev (' + (p.rev || 0) + ').'), 2700);
}
function openFile() {
  if (DIRTY && !armed('open', 'Unsaved changes — click Open again within 4 s to discard them.')) return;
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (d.app !== 'CADTools' || !d.items || !d.options) throw new Error('not a CADTools project file');
        PROJ = d; LS.set('current', PROJ); DIRTY = true; LS.set('dirty', true);
        toast('Opened ' + f.name + '. Save to add it to this browser\'s library.'); go('project', 'overview');
      } catch (e) { toast('Could not open ' + f.name + ': ' + e.message); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- shared UI bits (inline styles: the template has no form component yet) ---------- */
const S_LBL = 'display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:3px';
const S_UNIT = 'font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-faint)';
const S_INP = 'width:100%;box-sizing:border-box;padding:5px 7px;border:1px solid var(--line);border-radius:3px;font:inherit;font-size:13px;background:#fff;color:var(--ink)';
const S_GRID = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px';
const S_LIST = 'margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--ink-soft)';

function kpi(l, v, s) { return '<div class="kpi"><div class="lbl">' + esc(l) + '</div><div class="val">' + esc(v) + '</div><div class="sub">' + esc(s) + '</div></div>'; }
function fieldHtml(id, f, val) {
  const lab = '<label style="' + S_LBL + '" for="' + id + '">' + esc(f.l) + (f.u && f.u !== '-' ? ' <span style="' + S_UNIT + '">' + esc(f.u) + '</span>' : '') + '</label>';
  const v = val == null ? '' : String(val);
  const inp = f.opt
    ? '<select id="' + id + '" style="' + S_INP + '"><option value=""></option>' + f.opt.map((o) => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>'
    : (f.area ? '<textarea id="' + id + '" rows="3" style="' + S_INP + ';resize:vertical">' + esc(v) + '</textarea>'
      : '<input id="' + id + '" style="' + S_INP + '"' + (f.num ? ' inputmode="decimal"' : '') + ' value="' + esc(v) + '">');
  return '<div' + (f.wide ? ' style="grid-column:1/-1"' : '') + '>' + lab + inp + '</div>';
}
function readVal(el, f) { const s = el.value.trim(); if (f.num && s !== '' && isFinite(Number(s))) return Number(s); return s; }
const dash = (v) => (v == null || v === '' ? '—' : String(v));
function statusChip(s) { const m = { Proposed: 'st-info', Selected: 'st-ok', Rejected: 'st-bad', Superseded: 'st-na' }; return '<span class="st ' + (m[s] || 'st-na') + '">' + esc(s) + '</span>'; }
function toCSV(cols, rows) {
  const q = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.map((c) => q(c.label)).join(',')].concat(rows.map((r) => cols.map((c) => q(r[c.key])).join(','))).join('\r\n');
}

/* ---------- component page (every Earthworks … Layout page) ---------- */
function renderComponent(ctx, L) {
  const c = L.c, items = projItems(L.path), F = c.fields;
  const nextId = () => { let n = items.length + 1, id; do { id = L.tag + '-' + String(n++).padStart(3, '0'); } while (items.some((i) => i.id === id)); return id; };

    const id = el.querySelector('#f__id').value.trim();

    const editing = sel.value;
    if (items.some((i) => i.id === id && i.id !== editing)) { toast('Item ID ' + id + ' already exists in this register.'); return; }
    const values = {}; F.forEach((f) => { values[f.k] = readVal(el.querySelector('#f_' + f.k), f); });
    const rec = { id: id, desc: el.querySelector('#f__desc').value.trim(), values: values, updated: nowStr() };

  };
  const csvBtn = document.querySelector('[data-cad="csv"]');
  if (csvBtn) csvBtn.onclick = () => {
    if (!items.length) { toast('The register is empty.'); return; }
    const p = proj(); download('CADTools_' + slug(p.no || p.name) + '_' + L.tag + '_register_v' + (p.rev || 0) + '.csv', toCSV(regCols, regRows()), 'text/csv');
  };
}

function renderSaved(ctx) {

        list.map((q) => '<option value="' + esc(q.id) + '">' + esc((q.no ? q.no + ' · ' : '') + q.name + ' · rev ' + q.rev) + '</option>').join('') + '</select></div></div>' +
        '<div class="row" style="margin-top:10px;font-size:13px"><b style="margin-right:6px">Duplicate keeps:</b><label><input type="checkbox" id="dupItems" checked> component items</label><label><input type="checkbox" id="dupOpts"> study options</label><label><input type="checkbox" id="dupAssets" checked> asset library</label></div>' +
        '<div class="row" style="margin-top:10px"><button class="btn btn-steel btn-sm" id="libOpen">Open</button><button class="btn btn-amber btn-sm" id="libDup">Duplicate as new project</button><button class="btn btn-sm" id="libDel">Delete from library</button></div>'
      : '<p>No saved projects in this browser yet. Use <b>Save</b> in the header.</p>') + '</div>' +
    '<div id="libTbl"></div>';
  DPTable({ id: 'library', mount: ctx.el.querySelector('#libTbl'), title: 'Project library (this browser)', defaultSort: { key: 'saved', dir: 'desc' }, totals: false,
    columns: [{ key: 'no', label: 'Project no.', width: 110, format: dash }, { key: 'name', label: 'Name', width: 220, hideable: false }, { key: 'client', label: 'Client', width: 140, format: dash },
      { key: 'site', label: 'Site', width: 140, format: dash }, { key: 'rev', label: 'Rev', type: 'num', width: 70 }, { key: 'items', label: 'Items', type: 'num', width: 76 },
      { key: 'options', label: 'Options', type: 'num', width: 86 }, { key: 'saved', label: 'Last saved', width: 140 }],
    rows: list.map((q) => ({ no: q.no, name: q.name, client: q.client, site: q.site, rev: q.rev, items: cnt(q), options: (q.options || []).length, saved: q.saved })) });
  if (!list.length) return;
  const pick = () => library()[ctx.el.querySelector('#libSel').value];
  ctx.el.querySelector('#libOpen').onclick = () => {
    const q = pick(); if (!q) return;
    if (DIRTY && q.id !== proj().id && !armed('libopen', 'Current project has unsaved changes — click Open again within 4 s to discard them.')) return;
    PROJ = clone(q); LS.set('current', PROJ); DIRTY = false; LS.set('dirty', false); toast('Opened ' + q.name + ' rev ' + q.rev); go('project', 'overview');
  };
  ctx.el.querySelector('#libDup').onclick = () => {
    const q = pick(); if (!q) return;

    const n = clone(q), b = blankProject();
    n.id = b.id; n.no = ''; n.name = q.name + ' (copy)'; n.created = b.created; n.saved = ''; n.rev = 0;
    const keepItems = ctx.el.querySelector('#dupItems').checked, keepAssets = ctx.el.querySelector('#dupAssets').checked;
    Object.keys(n.items).forEach((k) => { const isAsset = k === 'layout/assets'; if ((isAsset && !keepAssets) || (!isAsset && !keepItems)) delete n.items[k]; });
    if (!ctx.el.querySelector('#dupOpts').checked) n.options = [];

    toast('Duplicated as a new project — set its number and name, then Save.'); go('project', 'info');
  };
  ctx.el.querySelector('#libDel').onclick = () => {
    const q = pick(); if (!q) return;
    if (!armed('libdel' + q.id, 'Click Delete again within 4 s to remove "' + q.name + '" from this browser\'s library.')) return;
    const lib2 = library(); delete lib2[q.id]; LS.set('library', lib2); toast('Removed ' + q.name + ' from the library.'); renderContent();
  };
}

function nextOptId() { const p = proj(); let n = p.options.length + 1, id; do { id = 'OPT-' + String(n++).padStart(3, '0'); } while (p.options.some((o) => o.id === id)); return id; }

}
function checkedOpts(el) { return Array.from(el.querySelectorAll('input[data-opt]:checked')).map((b) => b.dataset.opt); }

function renderReview(ctx) {
  const p = proj(), list = p.options.filter((o) => REVIEW_AREA === 'All areas' || o.area === REVIEW_AREA);
  ctx.el.innerHTML =
    '<div class="banner info" style="margin-bottom:12px">Tick one or more options, then select them, reject them (a reason is required and kept with the option), or return them to proposed. More than one option can be selected per area.</div>' +
    '<div class="two-col"><div><div style="max-width:320px;margin-bottom:10px"><label style="' + S_LBL + '" for="rvArea">Area</label>' + areaSelect('rvArea', REVIEW_AREA, true) + '</div>' +
      (list.length ? list.map(optCard).join('') : '<div class="card"><p>No options for this area yet. Add them in <b>Options register</b>.</p></div>') + '</div>' +
    '<div class="card"><h4>Decision</h4><label style="' + S_LBL + ';margin-top:8px" for="rvNote">Notes — the reason when rejecting</label><textarea id="rvNote" rows="5" style="' + S_INP + ';resize:vertical"></textarea>' +
      '<div class="row" style="margin-top:10px"><button class="btn btn-steel btn-sm" id="rvSel">Select ticked</button><button class="btn btn-sm" id="rvRej">Reject ticked</button><button class="btn btn-sm" id="rvBack">Return to proposed</button></div>' +
      '<p style="font-size:12px;color:var(--ink-faint);margin-top:10px">Selected options carry forward to <b>Iterate</b>. Rejected options stay in the register with the reason, so the same bad layout is not proposed again.</p></div></div>';
  ctx.el.querySelector('#rvArea').onchange = (e) => { REVIEW_AREA = e.target.value; renderContent(); };
  const apply = (status) => {
    const ids = checkedOpts(ctx.el), note = ctx.el.querySelector('#rvNote').value.trim();
    if (!ids.length) { toast('Tick at least one option.'); return; }
    if (status === 'Rejected' && !note) { toast('Enter the reason for rejecting in Notes.'); return; }
    p.options.forEach((o) => {
      if (ids.indexOf(o.id) < 0) return;
      o.status = status; o.updated = nowStr();
      if (status === 'Rejected') o.reason = note; else if (note) o.feedback = o.feedback ? o.feedback + ' | ' + note : note;
      if (status === 'Proposed') o.reason = '';
    });
    touch(); toast(ids.length + ' option(s) → ' + status); renderContent();
  };
  ctx.el.querySelector('#rvSel').onclick = () => apply('Selected');
  ctx.el.querySelector('#rvRej').onclick = () => apply('Rejected');
  ctx.el.querySelector('#rvBack').onclick = () => apply('Proposed');
}

function renderIterate(ctx) {
  const p = proj(), list = p.options.slice().sort((a, b) => (a.status === 'Selected' ? -1 : 0) - (b.status === 'Selected' ? -1 : 0));
  ctx.el.innerHTML =
    '<div class="banner" style="margin-bottom:12px"><b>v1:</b> iterating creates the next option record with the feedback attached, for the designer to develop. Automatic generation of new layouts is not built — see the README for the proposed route.</div>' +
    '<div class="two-col"><div>' + (list.length ? list.map(optCard).join('') : '<div class="card"><p>No options yet. Add them in <b>Options register</b>.</p></div>') + '</div>' +
    '<div class="card"><h4>Next iteration</h4><p style="font-size:12px;color:var(--ink-faint)">Tick the option(s) it builds on — selected options are listed first; rejected ones can be ticked to carry their lessons.</p>' +
      '<div style="display:grid;gap:10px;margin-top:8px"><div><label style="' + S_LBL + '" for="itTitle">Title</label><input id="itTitle" style="' + S_INP + '"></div>' +

  ctx.el.querySelector('#itGo').onclick = () => {
    const ids = checkedOpts(ctx.el), fb = ctx.el.querySelector('#itFb').value.trim();
    if (!ids.length) { toast('Tick the option(s) this iteration builds on.'); return; }
    if (!fb) { toast('Enter the feedback to apply.'); return; }
    const par = p.options.filter((o) => ids.indexOf(o.id) >= 0);
    const o = { id: nextOptId(), area: par[0].area, iter: Math.max.apply(null, par.map((x) => x.iter || 1)) + 1, parents: ids.join(', '), status: 'Proposed',
      title: ctx.el.querySelector('#itTitle').value.trim() || par[0].title + ' (rev)', summary: '', feedback: fb, reason: '', updated: nowStr() };
    if (ctx.el.querySelector('#itSup').checked) par.forEach((x) => { if (x.status === 'Proposed') { x.status = 'Superseded'; x.updated = nowStr(); } });
    p.options.push(o); touch(); toast('Created ' + o.id + ' (iteration ' + o.iter + ')'); go('study', 'options', 'all');
  };
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// localStorage wrapper — every call guarded (storage can be blocked or empty)
const LS = {
  k: (key) => APP.storageKey + '.' + key,
  get(key, dflt) { try { const v = localStorage.getItem(this.k(key)); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
  set(key, val) { try { localStorage.setItem(this.k(key), JSON.stringify(val)); } catch (e) { /* ignore */ } },
  clearAll() { try { Object.keys(localStorage).filter((k) => k.indexOf(APP.storageKey + '.') === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* ignore */ } }
};

let toastTimer = null;

/* ---------- state ---------- */
const state = {
  navMode: APP.allowNavSwitch ? LS.get('navMode', APP.defaultNavMode) : APP.defaultNavMode,
  cur: LS.get('cur', null),                 // { s, p, sp }
  lastPage: LS.get('lastPage', {}),         // section id -> page id
  lastSub: LS.get('lastSub', {}),           // "s/p" -> subpage id
  expanded: LS.get('expanded', null),       // "s:<id>" / "p:<s>/<p>" -> bool
  navWidth: LS.get('navWidth', 250),
  navCollapsed: LS.get('navCollapsed', false),
  sections: LS.get('sections', {}),         // collapsible section blocks: id -> collapsed bool
  cursor: null                              // keyboard cursor in vertical nav (row key)
};

const secById = (s) => NAV.find((x) => x.id === s);
const pageById = (s, p) => { const sec = secById(s); return sec ? (sec.pages || []).find((x) => x.id === p) : null; };
const subById = (s, p, sp) => { const pg = pageById(s, p); return pg && pg.subpages ? pg.subpages.find((x) => x.id === sp) : null; };

function normaliseCur(c) {
  let s = c && secById(c.s) ? c.s : NAV[0].id;
  const sec = secById(s);
  let p = c && pageById(s, c.p) ? c.p : (state.lastPage[s] && pageById(s, state.lastPage[s]) ? state.lastPage[s] : (sec.pages[0] || {}).id);
  const pg = pageById(s, p);
  let sp = null;
  if (pg && pg.subpages && pg.subpages.length) {
    sp = c && subById(s, p, c.sp) ? c.sp : (state.lastSub[s + '/' + p] && subById(s, p, state.lastSub[s + '/' + p]) ? state.lastSub[s + '/' + p] : pg.subpages[0].id);
  }
  return { s, p, sp };
}

function go(s, p, sp) {
  state.cur = normaliseCur({ s, p, sp });
  state.lastPage[state.cur.s] = state.cur.p;
  if (state.cur.sp) state.lastSub[state.cur.s + '/' + state.cur.p] = state.cur.sp;
  // make sure the current branch is open in the vertical tree
  state.expanded['s:' + state.cur.s] = true;
  if (state.cur.sp) state.expanded['p:' + state.cur.s + '/' + state.cur.p] = true;
  LS.set('cur', state.cur); LS.set('lastPage', state.lastPage); LS.set('lastSub', state.lastSub); LS.set('expanded', state.expanded);
  closeFilterPop();
  renderNav(); renderContent();
}

/* ---------- navigation ---------- */
function renderNav() { if (state.navMode === 'vertical') renderVNav(); else renderHNav(); }

function renderHNav() {
  const c = state.cur;
  const sec = secById(c.s), pg = pageById(c.s, c.p);
  $('hnavL1').innerHTML = NAV.map((s) => '<button class="tab" role="tab" data-s="' + esc(s.id) + '" aria-selected="' + (s.id === c.s) + '" title="' + esc(s.label) + '">' + esc(s.label) + '</button>').join('');
  $('hnavL2').innerHTML = (sec.pages || []).map((p) => '<button class="tab" role="tab" data-p="' + esc(p.id) + '" aria-selected="' + (p.id === c.p) + '" title="' + esc(p.label) + '">' + esc(p.label) + '</button>').join('');
  $('hnavL3').innerHTML = pg && pg.subpages ? pg.subpages.map((sp) => '<button class="tab" role="tab" data-sp="' + esc(sp.id) + '" aria-selected="' + (sp.id === c.sp) + '" title="' + esc(sp.label) + '">' + esc(sp.label) + '</button>').join('') : '';
}

function vKey(kind, s, p, sp) { return kind + ':' + s + (p ? '/' + p : '') + (sp ? '/' + sp : ''); }

function renderVNav() {
  const c = state.cur;
  const aside = $('vnav');
  aside.style.width = state.navWidth + 'px';
  aside.classList.toggle('collapsed', !!state.navCollapsed);
  $('vnavHide').textContent = state.navCollapsed ? '»' : '«';
  $('vnavHide').title = state.navCollapsed ? 'Show navigation panel' : 'Collapse navigation panel';
  const totalPages = NAV.reduce((n, s) => n + (s.pages || []).length, 0);
  let html = '<div class="vn-row vn-all" data-kind="all" title="Double-click to expand / collapse every section"><span class="chev"></span><span class="nm">All sections</span><span class="cnt">' + totalPages + '</span></div>';
  NAV.forEach((s) => {
    const open = !!state.expanded['s:' + s.id];
    const k = vKey('sec', s.id);
    html += '<div class="vn-group"><div class="vn-row vn-sec' + (s.id === c.s ? ' selected' : '') + (state.cursor === k ? ' cursor' : '') + '" data-kind="sec" data-s="' + esc(s.id) + '" data-key="' + esc(k) + '">' +
      '<span class="chev" data-toggle="1">' + (open ? '▾' : '▸') + '</span><span class="nm">' + esc(s.label) + '</span><span class="cnt">' + (s.pages || []).length + '</span></div>' +
      '<div class="vn-children' + (open ? ' open' : '') + '">';
    (s.pages || []).forEach((p) => {
      const hasSubs = !!(p.subpages && p.subpages.length);
      const popen = hasSubs && !!state.expanded['p:' + s.id + '/' + p.id];
      const isCur = s.id === c.s && p.id === c.p;
      const pk = vKey('page', s.id, p.id);
      html += '<div class="vn-row vn-page' + (isCur ? (hasSubs ? ' in-path' : ' selected') : '') + (state.cursor === pk ? ' cursor' : '') + '" data-kind="page" data-s="' + esc(s.id) + '" data-p="' + esc(p.id) + '" data-key="' + esc(pk) + '">' +
        '<span class="chev"' + (hasSubs ? ' data-toggle="1"' : '') + '>' + (hasSubs ? (popen ? '▾' : '▸') : '') + '</span><span class="nm">' + esc(p.label) + '</span>' + (hasSubs ? '<span class="cnt">' + p.subpages.length + '</span>' : '') + '</div>';
      if (hasSubs) {
        html += '<div class="vn-children' + (popen ? ' open' : '') + '">';
        p.subpages.forEach((sp) => {
          const sk = vKey('sub', s.id, p.id, sp.id);
          html += '<div class="vn-row vn-sub' + (isCur && sp.id === c.sp ? ' selected' : '') + (state.cursor === sk ? ' cursor' : '') + '" data-kind="sub" data-s="' + esc(s.id) + '" data-p="' + esc(p.id) + '" data-sp="' + esc(sp.id) + '" data-key="' + esc(sk) + '">' +
            '<span class="chev"></span><span class="nm">' + esc(sp.label) + '</span></div>';
        });
        html += '</div>';
      }
    });
    html += '</div></div>';
  });
  $('vnavBody').innerHTML = html;
}

function setAllExpanded(open) {
  NAV.forEach((s) => {
    state.expanded['s:' + s.id] = open;
    (s.pages || []).forEach((p) => { if (p.subpages && p.subpages.length) state.expanded['p:' + s.id + '/' + p.id] = open; });
  });
  if (!open) { state.expanded['s:' + state.cur.s] = false; }
  LS.set('expanded', state.expanded); renderVNav();
}

function toggleKey(k) { state.expanded[k] = !state.expanded[k]; LS.set('expanded', state.expanded); renderVNav(); }

function onVNavClick(e) {
  const row = e.target.closest('.vn-row'); if (!row) return;
  const d = row.dataset;
  state.cursor = d.key || null;
  if (d.kind === 'all') { return; }   // re-rendering here would break the double-click (expand / collapse all)
  // clicking the chevron only opens/closes the branch
  if (e.target.closest('[data-toggle]')) { toggleKey(d.kind === 'sec' ? 's:' + d.s : 'p:' + d.s + '/' + d.p); return; }
  if (d.kind === 'sec') {
    if (state.cur.s === d.s) toggleKey('s:' + d.s);       // same section: open/close
    else go(d.s);                                         // other section: open it and show its last page
  } else if (d.kind === 'page') {
    const pg = pageById(d.s, d.p);
    if (state.cur.s === d.s && state.cur.p === d.p && pg.subpages && pg.subpages.length) toggleKey('p:' + d.s + '/' + d.p);
    else go(d.s, d.p);
  } else if (d.kind === 'sub') go(d.s, d.p, d.sp);
}

// Keyboard: ↑/↓ move through the visible rows (and open them), ←/→ collapse/expand, Enter opens
function visibleRows() { return Array.from($('vnavBody').querySelectorAll('.vn-row[data-key]')).filter((r) => r.offsetParent !== null); }
function onVNavKey(e) {
  if (state.navMode !== 'vertical' || state.navCollapsed) return;
  const rows = visibleRows(); if (!rows.length) return;
  let i = rows.findIndex((r) => r.dataset.key === state.cursor);
  if (i < 0) i = rows.findIndex((r) => r.classList.contains('selected'));
  const row = rows[Math.max(0, i)], d = row.dataset;
  const branchKey = d.kind === 'sec' ? 's:' + d.s : (d.kind === 'page' && pageById(d.s, d.p).subpages ? 'p:' + d.s + '/' + d.p : null);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const next = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    state.cursor = next.dataset.key;
    const n = next.dataset;
    if (n.kind === 'sub') go(n.s, n.p, n.sp); else if (n.kind === 'page') go(n.s, n.p); else renderVNav();
    focusCursor();
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (branchKey) { state.expanded[branchKey] = e.key === 'ArrowRight'; LS.set('expanded', state.expanded); renderVNav(); }
    else if (e.key === 'ArrowLeft' && d.kind === 'sub') { state.cursor = vKey('page', d.s, d.p); renderVNav(); }
    else if (e.key === 'ArrowLeft' && d.kind === 'page') { state.cursor = vKey('sec', d.s); renderVNav(); }
    focusCursor();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (d.kind === 'sec') go(d.s); else if (d.kind === 'page') go(d.s, d.p); else go(d.s, d.p, d.sp);
  }
}
function focusCursor() { const el = $('vnavBody').querySelector('.vn-row.cursor'); if (el) el.scrollIntoView({ block: 'nearest' }); }

function initSplitter() {
  const split = $('vnav-split'), aside = $('vnav');
  split.addEventListener('mousedown', (e) => {
    if (state.navCollapsed) return;
    e.preventDefault();
    const startX = e.clientX, startW = aside.getBoundingClientRect().width;
    split.classList.add('dragging');
    const move = (ev) => { state.navWidth = Math.max(170, Math.min(420, startW + ev.clientX - startX)); aside.style.width = state.navWidth + 'px'; };
    const up = () => { split.classList.remove('dragging'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); LS.set('navWidth', state.navWidth); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
}

/* ---------- content ---------- */
function renderContent() {
  const c = state.cur, sec = secById(c.s), pg = pageById(c.s, c.p), sp = c.sp ? subById(c.s, c.p, c.sp) : null;
  $('crumbs').innerHTML = esc(sec.label) + ' › ' + (sp ? esc(pg.label) + ' › <b>' + esc(sp.label) + '</b>' : '<b>' + esc(pg.label) + '</b>');
  $('pageTitle').textContent = sp ? pg.label + ' — ' + sp.label : pg.label;
  $('pageActions').innerHTML = '';
  const el = $('pageBody');
  el.innerHTML = '';
  const fn = PAGES[c.s + '/' + c.p + (c.sp ? '/' + c.sp : '')] || PAGES[c.s + '/' + c.p];
  const ctx = { section: sec, page: pg, subpage: sp, el: el, setActions: (h) => { $('pageActions').innerHTML = h; } };
  if (fn) fn(ctx);
  else el.innerHTML = '<div class="banner">No content yet for <code>' + esc(c.s + '/' + c.p + (c.sp ? '/' + c.sp : '')) + '</code>. Add a function to <code>PAGES</code>.</div>';
  applySectionStates();
}

/* Collapsible section block (OBD / Scorecard style). Returns HTML; state is remembered. */
function sectionBlock(id, title, note, bodyHtml) {
  const collapsed = !!state.sections[id];
  return '<div class="section-head" data-sec="' + esc(id) + '"><div class="section-head-left"><button class="sec-toggle" data-sec-toggle="' + esc(id) + '" aria-label="Collapse or expand">' + (collapsed ? '+' : '−') + '</button>' +
    '<h3>' + esc(title) + '</h3></div>' + (note ? '<span class="note">' + esc(note) + '</span>' : '') + '</div>' +
    '<div class="section-body' + (collapsed ? ' collapsed' : '') + '" data-sec-body="' + esc(id) + '">' + bodyHtml + '</div>';
}
function applySectionStates() {
  const btn = document.querySelector('[data-act="toggle-all-sections"]');
  if (btn) { const ids = Array.from(document.querySelectorAll('[data-sec-body]')).map((b) => b.dataset.secBody); btn.textContent = ids.some((i) => !state.sections[i]) ? 'Collapse all' : 'Expand all'; }
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-sec-toggle]');
  if (t) {
    const id = t.dataset.secToggle; state.sections[id] = !state.sections[id]; LS.set('sections', state.sections);
    const body = document.querySelector('[data-sec-body="' + id + '"]'); if (body) body.classList.toggle('collapsed', state.sections[id]);
    t.textContent = state.sections[id] ? '+' : '−'; applySectionStates(); return;
  }
  const all = e.target.closest('[data-act="toggle-all-sections"]');
  if (all) {
    const ids = Array.from(document.querySelectorAll('[data-sec-body]')).map((b) => b.dataset.secBody);
    const collapse = ids.some((i) => !state.sections[i]);
    ids.forEach((i) => { state.sections[i] = collapse; }); LS.set('sections', state.sections); renderContent();
  }
});

/* ############################################################################
   DPTable — standard data table (sort · filter · hide/restore · resize · totals)
   DPTable({ id, mount, title, columns, rows, defaultSort:{key,dir}, totals:true })
   column: { key, label, width, type:'num'|'text', align:'left'|'right'|'center',
             format:(v,row)=>text, total:'sum'|'avg'|fn(rows)=>text,
             sortable:true, filterable:true, hideable:true }
   ############################################################################ */
const TABLE_FILTERS = {};   // kept for the session (per table id) so filters survive page switches
const TABLE_SORT = {};
let filterPop = null;       // { el, tableId, colKey, anchor, reposition }

function DPTable(o) {
  const t = {
    id: o.id, mount: o.mount, title: o.title || '', rows: o.rows || [], totals: o.totals !== false,
    cols: o.columns.map((c) => Object.assign({ sortable: true, filterable: true, hideable: true, type: 'text', width: 120 }, c, { align: c.align || (c.type === 'num' ? 'right' : 'left') })),
    defaultSort: o.defaultSort || null
  };
  t.hidden = LS.get('tbl.' + t.id + '.hidden', []).filter((k) => t.cols.some((c) => c.key === k && c.hideable));
  t.widths = LS.get('tbl.' + t.id + '.widths', {});
  t.filters = TABLE_FILTERS[t.id] || (TABLE_FILTERS[t.id] = {});
  if (!(t.id in TABLE_SORT)) TABLE_SORT[t.id] = t.defaultSort ? Object.assign({}, t.defaultSort) : null;

  const col = (k) => t.cols.find((c) => c.key === k);
  const visCols = () => t.cols.filter((c) => t.hidden.indexOf(c.key) < 0);
  const width = (c) => t.widths[c.key] || c.width;
  const text = (row, c) => { const v = row[c.key]; return c.format ? String(c.format(v, row)) : (v == null || v === '' ? '—' : String(v)); };

  function shownRows() {
    const keys = Object.keys(t.filters).filter((k) => col(k));
    let r = t.rows.filter((row) => keys.every((k) => t.filters[k].has(text(row, col(k)))));
    const s = TABLE_SORT[t.id];
    if (s && col(s.key)) {
      const c = col(s.key), dir = s.dir === 'desc' ? -1 : 1;
      r = r.slice().sort((a, b) => {
        const va = a[c.key], vb = b[c.key];
        if (c.type === 'num') { const na = va == null || va === '' ? null : Number(va), nb = vb == null || vb === '' ? null : Number(vb);
          if (na == null && nb == null) return 0; if (na == null) return 1; if (nb == null) return -1; return (na - nb) * dir; }
        return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), undefined, { numeric: true, sensitivity: 'base' }) * dir;
      });
    }
    return r;
  }

  function totalText(c, rows) {
    if (!c.total) return '';
    if (typeof c.total === 'function') return String(c.total(rows));
    const nums = rows.map((r) => Number(r[c.key])).filter((n) => !isNaN(n));
    if (!nums.length) return '—';
    const v = c.total === 'avg' ? nums.reduce((a, b) => a + b, 0) / nums.length : nums.reduce((a, b) => a + b, 0);
    return c.format ? String(c.format(v)) : String(Math.round(v * 100) / 100);
  }

  function render() {
    const cols = visCols(), rows = shownRows(), nF = Object.keys(t.filters).length, s = TABLE_SORT[t.id];
    const sortChanged = JSON.stringify(s) !== JSON.stringify(t.defaultSort);
    const tw = cols.reduce((n, c) => n + width(c), 0);
    let h = '<div class="tbl-card"><div class="tbl-toolbar"><div class="tl">' + (t.title ? '<h3>' + esc(t.title) + '</h3>' : '') +
      '<button class="btn btn-sm" data-act="clear-filters"' + (nF ? '' : ' disabled') + '>Clear all filters' + (nF ? ' (' + nF + ')' : '') + '</button>' +
      (sortChanged ? '<button class="btn btn-sm" data-act="reset-sort">Reset sorting</button>' : '') +
      (nF ? '<span class="shown">' + rows.length + ' of ' + t.rows.length + ' rows shown</span>' : '<span class="shown">' + t.rows.length + ' rows</span>') +
      '</div><div class="tr">' +
      (t.hidden.length ? '<div class="hidden-chips">' + t.hidden.map((k) => '<button class="hidden-chip" data-act="show-col" data-key="' + esc(k) + '" title="Show ' + esc(col(k).label) + '">+ ' + esc(col(k).label) + '</button>').join('') + '</div>' : '') +
      '<button class="btn btn-sm" data-act="show-all"' + (t.hidden.length ? '' : ' disabled') + '>Show all columns</button></div></div>';
    h += '<div class="tbl-wrap scroll"><table class="dp-grid" style="width:' + tw + 'px"><colgroup>' + cols.map((c) => '<col data-key="' + esc(c.key) + '" style="width:' + width(c) + 'px">').join('') + '</colgroup><thead><tr>';
    cols.forEach((c) => {
      const sorted = s && s.key === c.key, fActive = !!t.filters[c.key];
      h += '<th data-key="' + esc(c.key) + '" class="' + (width(c) < 100 && (c.filterable || c.hideable) ? 'th-narrow' : '') + '" title="' + esc(c.title || c.label) + '"><div class="th-inner">' +
        '<span class="th-label ' + c.align + (c.sortable ? '' : ' nosort') + '"' + (c.sortable ? ' data-act="sort"' : '') + '><span class="th-text">' + esc(c.label) + '</span>' +
        (c.sortable ? '<span class="sort-arrow">' + (sorted ? (s.dir === 'asc' ? '▲' : '▼') : '↕') + '</span>' : '') + '</span>' +
        '<span class="th-controls">' +
        (c.filterable ? '<button class="th-icon-btn col-filter' + (fActive ? ' active' : '') + '" data-act="filter" title="Filter ' + esc(c.label) + '" aria-label="Filter ' + esc(c.label) + '"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18l-7 9v7l-4 2v-9z"/></svg></button>' : '') +
        (c.hideable ? '<button class="th-icon-btn col-hide" data-act="hide" title="Hide ' + esc(c.label) + '" aria-label="Hide ' + esc(c.label) + '">✕</button>' : '') +
        '</span></div><span class="rs" data-act="resize" title="Drag to resize"></span></th>';
    });
    h += '</tr></thead><tbody>';
    if (!rows.length) h += '<tr><td class="empty" colspan="' + cols.length + '">No rows match the filters. <button class="btn btn-sm" data-act="clear-filters">Clear all filters</button></td></tr>';
    rows.forEach((r) => { h += '<tr>' + cols.map((c) => { const v = text(r, c); return '<td class="' + (c.type === 'num' ? 'num' : (c.align === 'center' ? 'center' : '')) + '" title="' + esc(v) + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; });
    h += '</tbody>';
    if (t.totals && cols.some((c) => c.total)) {
      h += '<tfoot><tr>' + cols.map((c, i) => {
        const v = i === 0 && !c.total ? 'Totals' + (nF ? ' (rows shown)' : '') : totalText(c, rows);
        return '<td class="' + (c.type === 'num' ? 'num' : '') + '">' + esc(v) + '</td>';
      }).join('') + '</tr></tfoot>';
    }
    h += '</table></div></div>';
    t.mount.innerHTML = h;
  }

  function saveHidden() { LS.set('tbl.' + t.id + '.hidden', t.hidden); }

  t.mount.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]'); if (!a || a.dataset.act === 'resize') return;
    const th = a.closest('th'), key = a.dataset.key || (th && th.dataset.key);
    switch (a.dataset.act) {
      case 'sort': { const s = TABLE_SORT[t.id]; TABLE_SORT[t.id] = { key: key, dir: s && s.key === key && s.dir === 'asc' ? 'desc' : 'asc' }; render(); break; }
      case 'reset-sort': TABLE_SORT[t.id] = t.defaultSort ? Object.assign({}, t.defaultSort) : null; render(); break;
      case 'filter': e.stopPropagation(); if (filterPop && filterPop.tableId === t.id && filterPop.colKey === key) closeFilterPop(); else openFilter(col(key), a); break;
      case 'hide': delete t.filters[key]; t.hidden.push(key); saveHidden(); closeFilterPop(); render(); break;
      case 'show-col': t.hidden = t.hidden.filter((k) => k !== key); saveHidden(); render(); break;
      case 'show-all': t.hidden = []; saveHidden(); render(); break;
      case 'clear-filters': Object.keys(t.filters).forEach((k) => delete t.filters[k]); closeFilterPop(); render(); break;
    }
  });

  // drag a heading's right edge to resize that column
  t.mount.addEventListener('mousedown', (e) => {
    const h = e.target.closest('.rs'); if (!h) return;
    e.preventDefault(); e.stopPropagation();
    const key = h.closest('th').dataset.key, c = col(key), colEl = t.mount.querySelector('col[data-key="' + key + '"]'), table = t.mount.querySelector('table');
    const startX = e.clientX, startW = width(c), otherW = visCols().reduce((n, x) => n + (x.key === key ? 0 : width(x)), 0);
    h.classList.add('dragging');
    const move = (ev) => { const w = Math.max(48, Math.round(startW + ev.clientX - startX)); t.widths[key] = w; colEl.style.width = w + 'px'; table.style.width = (otherW + w) + 'px'; };
    const up = () => { h.classList.remove('dragging'); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); LS.set('tbl.' + t.id + '.widths', t.widths); render(); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });

  // Excel-style filter: search, select all, tick values, Clear / OK. Enter (or OK) while searching keeps only the ticked matches.
  function openFilter(c, anchor) {
    closeFilterPop();
    const vals = Array.from(new Set(t.rows.map((r) => text(r, c))));
    const allNum = c.type === 'num' || vals.filter((v) => v !== '—').every((v) => !isNaN(parseFloat(v.replace(/[^0-9.\-]/g, ''))));
    const num = (v) => parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    vals.sort((a, b) => (a === '—') - (b === '—') || (allNum ? num(a) - num(b) : a.localeCompare(b, undefined, { numeric: true })));
    const draft = new Set(t.filters[c.key] || vals);
    let query = '';
    const el = document.createElement('div');
    el.className = 'filter-pop';
    el.innerHTML = '<div class="filter-panel"><input class="filter-search" placeholder="Type to search ' + esc(c.label.toLowerCase()) + '…"><div class="filter-hint" hidden></div>' +
      '<label class="filter-row filter-select-all"><input type="checkbox" data-all> Select all</label><div class="filter-list"></div>' +
      '<div class="filter-actions"><button class="btn btn-sm" data-f="clear">Clear</button><button class="btn btn-sm btn-navy" data-f="ok">OK</button></div></div>';
    document.body.appendChild(el);
    const search = el.querySelector('.filter-search'), list = el.querySelector('.filter-list'), all = el.querySelector('[data-all]'), hint = el.querySelector('.filter-hint');
    const visible = () => vals.filter((v) => v.toLowerCase().indexOf(query.toLowerCase()) !== -1);
    function draw() {
      const vis = visible();
      list.innerHTML = vis.length ? vis.map((v, i) => '<label class="filter-row"><input type="checkbox" data-i="' + i + '"' + (draft.has(v) ? ' checked' : '') + '> ' + esc(v) + '</label>').join('') : '<div class="filter-empty">No values</div>';
      all.checked = vis.length > 0 && vis.every((v) => draft.has(v));
      hint.hidden = !query.trim();
      hint.textContent = vis.length + ' match' + (vis.length === 1 ? '' : 'es') + ' — OK / Enter shows only the ticked matches';
      list.querySelectorAll('input').forEach((cb) => cb.addEventListener('change', () => { const v = vis[Number(cb.dataset.i)]; if (cb.checked) draft.add(v); else draft.delete(v); all.checked = vis.every((x) => draft.has(x)); }));
    }
    function apply(setOrNull) {
      if (setOrNull === undefined) {
        const chosen = query.trim() ? new Set(visible().filter((v) => draft.has(v))) : draft;
        setOrNull = chosen.size >= vals.length ? null : chosen;
      }
      if (setOrNull) t.filters[c.key] = setOrNull; else delete t.filters[c.key];
      closeFilterPop(); render();
    }
    search.addEventListener('input', () => { query = search.value; draw(); });
    search.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); apply(); } });
    all.addEventListener('change', () => { visible().forEach((v) => { if (all.checked) draft.add(v); else draft.delete(v); }); draw(); });
    el.querySelector('[data-f="clear"]').addEventListener('click', () => apply(null));
    el.querySelector('[data-f="ok"]').addEventListener('click', () => apply());
    el.addEventListener('click', (e) => e.stopPropagation());
    el.addEventListener('mousedown', (e) => e.stopPropagation());
    const reposition = () => {
      const btn = t.mount.querySelector('th[data-key="' + c.key + '"] .col-filter') || anchor;
      if (!document.body.contains(btn)) { closeFilterPop(); return; }
      const r = btn.getBoundingClientRect();
      el.style.top = (r.bottom + 2) + 'px'; el.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 230)) + 'px';
    };
    filterPop = { el, tableId: t.id, colKey: c.key, reposition };
    draw(); reposition(); search.focus();
  }

  render();
  return { render, setRows(rows) { t.rows = rows || []; render(); }, getShownRows: shownRows };
}

function closeFilterPop() { if (filterPop) { filterPop.el.remove(); filterPop = null; } }
document.addEventListener('click', () => closeFilterPop());
window.addEventListener('scroll', () => { if (filterPop) filterPop.reposition(); }, true);
window.addEventListener('resize', () => { if (filterPop) filterPop.reposition(); });

/* ---------- wiring ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeFilterPop(); closeVersionHistory(); return; }
  if (document.activeElement && document.activeElement.id === 'vnavBody') onVNavKey(e);
});

function init() {
  if (!state.expanded) state.expanded = {};
  state.cur = normaliseCur(state.cur);
  state.expanded['s:' + state.cur.s] = true;
  if (state.cur.sp) state.expanded['p:' + state.cur.s + '/' + state.cur.p] = true;

  renderHeader();
  $('hnavL1').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) go(b.dataset.s); });
  $('hnavL2').addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (b) go(state.cur.s, b.dataset.p); });
  $('hnavL3').addEventListener('click', (e) => { const b = e.target.closest('[data-sp]'); if (b) go(state.cur.s, state.cur.p, b.dataset.sp); });
  $('vnavBody').addEventListener('click', onVNavClick);
  $('vnavBody').addEventListener('dblclick', (e) => {
    const row = e.target.closest('.vn-all'); if (!row) return;
    e.preventDefault();
    const anyClosed = NAV.some((s) => !state.expanded['s:' + s.id] || (s.pages || []).some((p) => p.subpages && p.subpages.length && !state.expanded['p:' + s.id + '/' + p.id]));
    setAllExpanded(anyClosed);
  });
  $('vnavExpand').addEventListener('click', () => setAllExpanded(true));
  $('vnavCollapse').addEventListener('click', () => setAllExpanded(false));
  const toggleRail = () => { state.navCollapsed = !state.navCollapsed; LS.set('navCollapsed', state.navCollapsed); renderVNav(); };
  $('vnavHide').addEventListener('click', toggleRail);
  $('vnavRail').addEventListener('click', toggleRail);
  initSplitter();
  setNavMode(state.navMode);
  renderContent();
}

// Exposed for tool code and the browser console
window.DP = { APP, NAV, go, toast, setHeaderText, setNavMode, DPTable, sectionBlock, LS, esc };

init();
})();
</script>
